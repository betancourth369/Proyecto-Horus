spring.application.name=back_horus

# ==================================================
# CONFIGURACIÓN DE LA APLICACIÓN
# ==================================================
# Puerto HTTP en el que se ejecutará el backend Spring Boot.
# Si no se especifica, Spring Boot utiliza normalmente el puerto 8080.
# server.port=8081

# ==================================================
# CONFIGURACIÓN SQL - CONEXIÓN A POSTGRESQL
# ==================================================
# URL de conexión a la base de datos.
# localhost: el servidor PostgreSQL está en este mismo ordenador.
# 5432: puerto habitual de PostgreSQL.
# horus_db: nombre de la base de datos que hemos creado.
spring.datasource.url=jdbc:postgresql://localhost:5432/horus_db

# Usuario de PostgreSQL con permisos para acceder a horus_db.
spring.datasource.username=postgres

# Contraseña del usuario de PostgreSQL.
# La contraseña se obtiene de la variable de entorno DB_PASSWORD.
# Definirla en Windows o en la Run Configuration de IntelliJ.
spring.datasource.password=${DB_PASSWORD}

# ==================================================
# CONFIGURACIÓN JPA - PERSISTENCIA DE DATOS
# ==================================================
# update: Hibernate actualiza el esquema de la base de datos según las
# entidades JPA del proyecto, intentando conservar los datos existentes.
# Es práctico durante el desarrollo, pero no es la estrategia recomendada
# para gestionar cambios de esquema en producción.
spring.jpa.hibernate.ddl-auto=update

# Muestra por consola las sentencias SQL que Hibernate ejecuta.
# Útil para aprender y depurar durante el desarrollo.
spring.jpa.show-sql=true

# Evita mantener abierta la sesión de persistencia hasta el final
# de la respuesta HTTP. Ayuda a que el acceso a datos quede controlado
# dentro de las capas de servicio.
spring.jpa.open-in-view=false


# ==================================================
# CONFIGURACIÓN DE REGISTROS SQL FORMATEADOS
# ==================================================
spring.jpa.properties.hibernate.format_sql=true